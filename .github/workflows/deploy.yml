name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the deployment from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten toolchain
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'

      - name: Configure CMake for WebAssembly
        run: emcmake cmake -B build_web -DCMAKE_BUILD_TYPE=Release

      - name: Build WebAssembly
        run: cmake --build build_web

      - name: Rename output to index.html
        # GitHub Pages looks for an index.html by default. 
        # We duplicate RaylibGame.html so the root URL works automatically.
        run: cp build_web/RaylibGame.html build_web/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the build_web directory
          path: 'build_web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
